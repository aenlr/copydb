services:
  h2:
    image: h2:local
    build:
      context: ./h2
      args:
        - H2_VERSION=${H2_VERSION-2.4.240}
    restart: "no"
    volumes:
      - h2:/data
    ports:
      - 9092:9092
      - 9093:8082

  oracle:
    # https://container-registry.oracle.com/ords/ocr/ba/database/express
    image: container-registry.oracle.com/database/express:21.3.0-xe
    restart: "no"
    stop_signal: SIGTERM
    stop_grace_period: 600s
    volumes:
      - oracle:/opt/oracle/oradata
      # Really setup scripts, but the image comes with a database
      # created already so scripts in /opt/oracle/scripts/setup are
      # not run. See /opt/oracle/runOracle.sh.
      - ./oracle/startup:/opt/oracle/scripts/startup
    environment:
      - ORACLE_PWD=oracle
      - ORACLE_CHARACTERSET=AL32UTF8
      - ORA_SDTZ=OS_TZ
      - TZ
      # The classic SCOTT schema. Connect as SCOTT/tiger.
      # Created by default, set to N to disable.
      - CREATE_SCOTT_SCHEMA
      # Various samples from https://github.com/oracle-samples/db-sample-schemas
      # NOT created by default. Set to Y to enable.
      - CREATE_SAMPLE_SCHEMAS

    ports:
      - 1521:1521
      - 5500:5500

volumes:
  h2: {}
  oracle: {}
