services:
  h2:
    image: h2:local
    pull_policy: never
    build:
      context: ./containers/h2
      args:
        - H2_VERSION=${H2_VERSION-2.4.240}
    container_name: copydb-h2
    restart: "no"
    volumes:
      - h2:/data
    ports:
      - 9092:9092
      - 9093:8082

  ora18c:
    # https://container-registry.oracle.com/ords/ocr/ba/database/express
    image: container-registry.oracle.com/database/express:18.4.0-xe
    container_name: copydb-ora18c
    restart: "no"
    stop_signal: SIGTERM
    stop_grace_period: 600s
    volumes:
      - ora18c:/opt/oracle/oradata
      - ./containers/oracle/scripts:/opt/oracle/scripts
      # Scripts for installing samples
      - ./containers/ora21c/samples:/home/oracle/samples
    environment:
      - ORACLE_PWD=oracle
      - ORACLE_CHARACTERSET=AL32UTF8
      - ORA_SDTZ=OS_TZ
      - TZ
    ports:
      - 1518:1521
      - 5518:5500
    profiles: [disabled]

  ora21c:
    # https://container-registry.oracle.com/ords/ocr/ba/database/express
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: copydb-ora21c
    restart: "no"
    stop_signal: SIGTERM
    stop_grace_period: 600s
    volumes:
      - ora21c:/opt/oracle/oradata
      - ./containers/oracle/scripts:/opt/oracle/scripts
      # Scripts for installing samples
      - ./containers/ora21c/samples:/home/oracle/samples
    environment:
      - ORACLE_PWD=oracle
      - ORACLE_CHARACTERSET=AL32UTF8
      - ORA_SDTZ=OS_TZ
      - TZ
    ports:
      - 1521:1521
      - 5521:5500
    profiles: [disabled]

  ora26ai:
    # https://container-registry.oracle.com/ords/ocr/ba/database/free
    image: container-registry.oracle.com/database/free:23.26.2.0-lite
    container_name: copydb-ora26ai
    restart: "no"
    stop_signal: SIGTERM
    stop_grace_period: 600s
    volumes:
      - ora26ai:/opt/oracle/oradata
      - ./containers/oracle/scripts:/opt/oracle/scripts
    environment:
      - ORACLE_PWD=oracle
      - ORACLE_CHARACTERSET=AL32UTF8
      - ORA_SDTZ=OS_TZ
      - TZ
    ports:
      - 1526:1521
      - 5526:5500
    profiles: [disabled]

  postgres:
    image: postgres:18
    container_name: copydb-postgres
    restart: "no"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 5432:5432

volumes:
  h2: {}
  ora18c: {}
  ora21c: {}
  ora26ai: {}
  postgres: {}
